<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b939e"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f9d58"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <!-- 游戏内核 -->
  <rect x="24" y="150" width="168" height="150" rx="10" fill="#eef3fb" stroke="#c7d8f2"/>
  <text x="108" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a6b">游戏内核</text>
  <text x="108" y="196" text-anchor="middle" font-size="10.5" fill="#4a5b73">src/core/</text>
  <text x="108" y="218" text-anchor="middle" font-size="10.5" fill="#4a5b73">World.step()</text>
  <text x="108" y="235" text-anchor="middle" font-size="10.5" fill="#4a5b73">固定 16.667ms 步进</text>
  <text x="108" y="252" text-anchor="middle" font-size="10.5" fill="#4a5b73">可 clone / 可重放</text>
  <text x="108" y="277" text-anchor="middle" font-size="10" fill="#7a8798">与 Chromium 同参数</text>

  <!-- 状态文档 -->
  <rect x="232" y="150" width="168" height="150" rx="10" fill="#f2f0fb" stroke="#d5cdf0"/>
  <text x="316" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#3d2a70">state document</text>
  <text x="316" y="196" text-anchor="middle" font-size="10.5" fill="#5b4b85">快照 → 文本</text>
  <text x="316" y="218" text-anchor="middle" font-size="10.5" fill="#5b4b85">速度 / 姿态</text>
  <text x="316" y="235" text-anchor="middle" font-size="10.5" fill="#5b4b85">最近 3 个障碍</text>
  <text x="316" y="252" text-anchor="middle" font-size="10.5" fill="#5b4b85">(类型/尺寸/距离/ETA)</text>
  <text x="316" y="277" text-anchor="middle" font-size="10" fill="#8a7fab">laya/heads.js</text>

  <!-- typed questions -->
  <rect x="440" y="120" width="176" height="210" rx="10" fill="#fdf3e4" stroke="#f0dcbb"/>
  <text x="528" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a06">typed questions</text>
  <text x="528" y="170" text-anchor="middle" font-size="10.5" fill="#8a651f">choice</text>
  <text x="528" y="186" text-anchor="middle" font-size="10" fill="#a08a5e">NONE / JUMP / DUCK / DROP</text>
  <text x="528" y="212" text-anchor="middle" font-size="10.5" fill="#8a651f">score</text>
  <text x="528" y="228" text-anchor="middle" font-size="10" fill="#a08a5e">现在有多急？5 档</text>
  <text x="528" y="254" text-anchor="middle" font-size="10.5" fill="#8a651f">noul</text>
  <text x="528" y="270" text-anchor="middle" font-size="10" fill="#a08a5e">不动会不会撞？</text>
  <rect x="458" y="288" width="140" height="26" rx="6" fill="#fff" stroke="#f0dcbb"/>
  <text x="528" y="305" text-anchor="middle" font-size="10" fill="#8a651f">Router：fast / reason</text>

  <!-- 决策头 -->
  <rect x="656" y="86" width="176" height="278" rx="10" fill="#e9f6ee" stroke="#c2e2cf"/>
  <text x="744" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0b5b34">决策头</text>

  <rect x="674" y="126" width="140" height="52" rx="7" fill="#ffffff" stroke="#c2e2cf"/>
  <text x="744" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#14663d">PlannerHead</text>
  <text x="744" y="163" text-anchor="middle" font-size="9.5" fill="#4d7a62">宏动作滚动试算 · 教师</text>

  <rect x="674" y="186" width="140" height="52" rx="7" fill="#ffffff" stroke="#8fd0a8"/>
  <text x="744" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#0b5b34">NeuralHead</text>
  <text x="744" y="223" text-anchor="middle" font-size="9.5" fill="#4d7a62">27→72→72→4 · 学生</text>

  <rect x="674" y="246" width="140" height="42" rx="7" fill="#ffffff" stroke="#c2e2cf"/>
  <text x="744" y="272" text-anchor="middle" font-size="11" fill="#14663d">RuleHead / RemoteHead</text>

  <rect x="674" y="298" width="140" height="42" rx="7" fill="#ffffff" stroke="#c2e2cf"/>
  <text x="744" y="324" text-anchor="middle" font-size="11" fill="#14663d">Laya 远端服务</text>

  <!-- 输出 -->
  <rect x="856" y="180" width="0" height="0"/>
  <rect x="232" y="352" width="600" height="74" rx="10" fill="#f4f6f8" stroke="#dfe4ea"/>
  <text x="532" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#3c4453">typed answers → 执行 → 下一帧</text>
  <text x="532" y="397" text-anchor="middle" font-size="10.5" fill="#697585">action.label 直接送进 World.act()，随后 World.step() 推进物理</text>
  <text x="532" y="414" text-anchor="middle" font-size="10.5" fill="#697585">全程无文本生成、无解析环节；一次前向给出三类答案</text>

  <!-- 训练闭环 -->
  <rect x="24" y="30" width="432" height="90" rx="10" fill="#fff8e6" stroke="#f0dcbb" stroke-dasharray="5 4"/>
  <text x="240" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a06">离线训练闭环（node brain/distill.mjs）</text>
  <text x="240" y="76" text-anchor="middle" font-size="10.5" fill="#8a651f">PlannerHead 跑 30 局 → 采集「状态 → 四动作存活评分」</text>
  <text x="240" y="94" text-anchor="middle" font-size="10.5" fill="#8a651f">→ MSE 回归 → DAgger ×3 → ES 微调 → brain/weights.json</text>

  <rect x="528" y="30" width="304" height="56" rx="10" fill="#eef3fb" stroke="#c7d8f2"/>
  <text x="680" y="53" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a3a6b">感知延迟实验</text>
  <text x="680" y="72" text-anchor="middle" font-size="10" fill="#4a5b73">同一 delay=8（133ms）档位下对比各大脑</text>

  <!-- 箭头 -->
  <line x1="192" y1="225" x2="228" y2="225" stroke="#8b939e" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="400" y1="225" x2="436" y2="225" stroke="#8b939e" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="616" y1="225" x2="652" y2="225" stroke="#1a73e8" stroke-width="1.6" marker-end="url(#ar2)"/>
  <path d="M744 368 L744 448 Q744 458 734 458 L120 458 Q108 458 108 448 L108 306" fill="none" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar3)"/>
  <text x="430" y="452" text-anchor="middle" font-size="10" fill="#0f9d58">闭环：决策 → 动作 → 物理 → 新状态</text>
</svg>
